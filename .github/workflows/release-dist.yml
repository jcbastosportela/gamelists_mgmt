name: Release ROM Manager Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask lxml

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --clean --noconfirm rom-manager.spec

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rom-manager
          tag_name: ${{ github.sha }}
          name: ROM Manager v${{ github.sha }}
          body: |
            Automated release of ROM Manager binary.
            Built on Ubuntu Latest.
          draft: false
          prerelease: false